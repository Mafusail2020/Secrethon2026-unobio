[project]
name = "unobio-underwriting"
version = "0.1.0"
description = "Drug-program underwriting backend (Secrethon 2026, Unobio track)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "duckdb>=1.5.6",
    "pypdf>=6.20.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/nodes/*.py" = ["E501"]  # one-line UI descriptions
"app/chat/answer.py" = ["E501"]  # prompt text
"app/chat/summary.py" = ["E501"]  # prompt text

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
